# atoms/schema.yaml — universal block vocabulary
#
# Surface compatibility:
#   works_on: full support
#   degraded_on: renders with caveats
#   incompatible_on: do not use
#
# Source credit:
#   Every atom declares its origin.
#
# Surfaces: web | meet-stage | googlechat | email | pdf

blocks:
- type: intro
  description: Italic series link and/or transparency note shown at the top
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    series_label: string
    series_url: url
    continuation: string (optional)
    note: string (optional)
  source: &id001
    name: a2ui-catalogue
    url: https://github.com/curtiskrygier/a2ui-catalogue
    license: MIT
- type: body
  description: One or more prose paragraphs
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    text: string
  source: *id001
- type: heading
  description: H2 section title
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    text: string
  source: *id001
- type: subheading
  description: H3 subsection title
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    text: string
  source: *id001
- type: quote
  description: Pull quote or blockquote
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: blockquote styling stripped — renders as plain text
  fields:
    text: string
    attribution: string (optional)
  source: *id001
- type: code
  description: Fenced code block
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: renders as monospace text, no syntax highlighting
    - surface: email
      note: pre/code styling unreliable across email clients — use plain text or image
  fields:
    language: string
    content: string
  source: *id001
- type: pipeline
  description: Inline left-to-right flow (e.g. build pipeline steps)
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: monospace background stripped — use bullet_list instead
    - surface: email
      note: background colour unreliable — use bullet_list instead
  fields:
    steps: list[string]
  source: *id001
- type: bullet_list
  description: Unordered list with optional bold lead-in per item
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    items:
    - label: string (optional)
      text: string
  source: *id001
- type: divider
  description: Visual section break
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: hr not supported in Chat cards — omit or use heading instead
  source: *id001
- type: youtube
  description: Responsive 16:9 embedded YouTube video
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: iframes not supported — use image with link instead
    - surface: email
      reason: iframes stripped by all email clients — use image thumbnail with link
    - surface: pdf
      reason: iframes not renderable in PDF — use image thumbnail
  fields:
    url: string
    caption: string (optional)
  source: *id001
- type: image
  description: Single image with caption, hosted at a public URL
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: external images may be blocked by Chat security policy — use Chat-hosted
        URLs
  fields:
    url: string
    alt: string
    caption: string (optional)
    width: string (optional)
  source: *id001
- type: image_pair
  description: Two images side by side with individual captions
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: table layout may reflow — use two separate image blocks instead
    - surface: email
      note: side-by-side layout unreliable on mobile email — use two separate images
  fields:
    left:
      url: string
      alt: string
      caption: string (optional)
    right:
      url: string
      alt: string
      caption: string (optional)
  source: *id001
- type: diagram
  description: SVG architecture diagram hosted at a public URL
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: SVG may not render — use PNG export instead
    - surface: email
      note: SVG support inconsistent across email clients — use PNG export
  fields:
    url: string
    caption: string (optional)
  source: *id001
- type: repo_links
  description: Formatted GitHub repo link list at end of article
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: list styling stripped — renders as plain links
  fields:
    links:
    - label: string
      url: string
  source: *id001
- type: closing
  description: Final paragraph + optional hashtags
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    text: string
    tags: list[string] (optional)
  source: *id001
- type: callout
  description: Highlighted alert box — info, warning, tip, or danger
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: border-left and background colour stripped — use bold text prefix instead
    - surface: email
      note: background colour unreliable — test across clients or use plain bold text
  fields:
    kind: info | warning | tip | danger
    title: string (optional)
    text: string
  source: *id001
- type: steps
  description: Numbered sequential steps with blue circle indicators
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: custom list styling stripped — use bullet_list with manual numbering
    - surface: email
      note: flexbox layout unreliable — use ordered_list or bullet_list
  fields:
    items:
    - label: string (optional)
      text: string
  source: *id001
- type: table
  description: HTML table with styled headers, alternating rows, horizontal scroll
    on mobile
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: HTML tables not supported in Chat cards — use bullet_list or key_value
        instead
  fields:
    caption: string (optional)
    headers: list[string]
    rows: list[list[string]]
  source: *id001
- type: tabs
  description: CSS-only tabbed panels — ideal for multi-language code examples
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on: []
    incompatible_on:
    - surface: googlechat
      reason: CSS radio button trick not supported — use separate code blocks
    - surface: email
      reason: CSS :checked not supported in email — use separate code blocks
    - surface: pdf
      reason: interactive CSS not renderable — use separate code blocks
  fields:
    accent: string (optional)
    tabs:
    - label: string
      language: string
      content: string
  source: *id001
- type: key_value
  description: Key-value table for env vars, config options, API fields
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: table layout stripped — use bullet_list with bold keys instead
    - surface: email
      note: table styling may vary — test or use bullet_list
  fields:
    title: string (optional)
    items:
    - key: string
      description: string
      required: bool (optional)
      default: string (optional)
  source: *id001
- type: before_after
  description: Side-by-side code comparison — red/green panels showing old vs new
    approach
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: pdf
      note: colour panels may not export cleanly — use two separate code blocks
    incompatible_on:
    - surface: googlechat
      reason: side-by-side layout and colour styling not supported — use two code
        blocks
    - surface: email
      reason: flexbox and background colour unreliable — use two separate code blocks
  fields:
    language: string
    before: string
    after: string
    before_label: string (optional)
    after_label: string (optional)
    caption: string (optional)
  source: *id001
- type: api_reference
  description: Full API/function reference block — name, description, parameters table,
    returns, example
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: complex table layout not supported — use key_value + code block instead
    - surface: email
      note: nested table styling unreliable — use key_value + code block
  fields:
    name: string
    kind: function | endpoint | class | method
    method: string (optional)
    description: string
    deprecated: bool (optional)
    parameters:
    - name: string
      type: string
      required: bool (optional)
      description: string
      default: string (optional)
    returns: string (optional)
    example:
      label: string (optional)
      language: string
      code: string
  source: *id001
- type: gallery
  description: Responsive image grid with CSS-only lightbox on click
  surfaces:
    works_on:
    - web
    degraded_on:
    - surface: meet-stage
      note: CSS :target lightbox may not work in iframe — images show without lightbox
    - surface: pdf
      note: grid renders but lightbox is non-functional — use image_pair or image
    incompatible_on:
    - surface: googlechat
      reason: CSS grid and :target not supported — use image_pair instead
    - surface: email
      reason: CSS grid and :target stripped — use individual image blocks
  fields:
    cols: 2 | 3 | 4 (optional, default 3)
    caption: string (optional)
    images:
    - url: string
      alt: string
      caption: string (optional)
  source: *id001
- type: video_pair
  description: Two YouTube videos side by side with optional labels
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: iframes not supported — use two image thumbnails with links
    - surface: email
      reason: iframes stripped — use image thumbnails with links
    - surface: pdf
      reason: iframes not renderable — use image thumbnails
  fields:
    caption: string (optional)
    left:
      url: string
      label: string (optional)
    right:
      url: string
      label: string (optional)
  source: *id001
- type: carousel
  description: CSS-only sliding carousel with dot indicators and prev/next arrows
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: pdf
      note: only first slide renders — use gallery instead
    incompatible_on:
    - surface: googlechat
      reason: CSS radio button trick not supported — use image_pair or gallery
    - surface: email
      reason: CSS :checked not supported in email — use individual images
  fields:
    accent: string (optional)
    caption: string (optional)
    slides:
    - url: string
      label: string (optional)
      subtitle: string (optional)
  source: *id001
- type: timeline
  description: Vertical timeline with dot connectors, date badges, tag pills
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: flexbox layout and custom styling stripped — use bullet_list with bold
        dates
    - surface: email
      note: flexbox unreliable on mobile email — use bullet_list with bold dates
  fields:
    title: string (optional)
    accent: string (optional)
    events:
    - date: string
      label: string
      text: string
      tag: string (optional)
  source: *id001
- type: annotated_code
  description: Code block with numbered yellow callout bubbles on specific lines,
    explanation list below
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: pdf
      note: callout bubbles may not render inline — consider code + steps instead
    incompatible_on:
    - surface: googlechat
      reason: inline flexbox badges not supported — use code block + bullet_list
    - surface: email
      reason: inline positioning unreliable — use code block + bullet_list
  fields:
    language: string
    code: string
    caption: string (optional)
    annotations:
    - line: integer
      text: string
  source: *id001
- type: stat_card
  description: Glowing neon stat card — large value with label and optional delta
    indicator
  source: &id002
    name: UIverse.io community
    url: https://uiverse.io
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: pdf
      note: glow animations not rendered — displays as flat card
    incompatible_on:
    - surface: googlechat
      reason: complex CSS not supported — use key_value or body instead
    - surface: email
      reason: CSS gradients and animations unreliable — use plain text
  fields:
    value: string
    label: string
    delta: string (optional)
    is_up: bool (optional)
    accent: string (optional)
- type: progress_bar
  description: Animated CSS progress bar with glow pulse effect
  source: *id002
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: pdf
      note: animation not rendered — shows static bar
    incompatible_on:
    - surface: googlechat
      reason: CSS animations not supported — use bullet_list or body
    - surface: email
      reason: CSS animations stripped — use plain percentage text
  fields:
    value: integer (0-100)
    label: string
    accent: string (optional)
    show_percent: bool (optional)
    caption: string (optional)
- type: badge_group
  description: Group of coloured status badges with optional pulse animation — green/cyan/blue/yellow/red/purple/grey
  source: *id002
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: email
      note: background colours may vary — test or use plain text labels
    - surface: pdf
      note: pulse animations not rendered — badges display as flat
    incompatible_on:
    - surface: googlechat
      reason: inline flex and border-radius not supported — use bullet_list
  fields:
    title: string (optional)
    badges:
    - text: string
      color: green|cyan|blue|yellow|red|purple|grey
      pulse: bool (optional)
- type: sparkline
  description: Renders a small, simple line chart without axes or coordinates, showing
    general trends.
  source: &id003
    name: UIverse.io community
    url: https://uiverse.io
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Requires SVG or Canvas rendering which is not supported. Consider `metric_delta`
        or `trend_indicator` for textual trends.
    - surface: email
      reason: Requires dynamic rendering or complex image generation, not suitable
        for static email content.
    - surface: pdf
      reason: Requires dynamic rendering or complex image generation, not suitable
        for static PDF content.
  fields:
    data: list of numbers (e.g., [10, 12, 8, 15, 13])
    color: string (hex or named color, e.g., '#4CAF50' or 'green')
    line_width: number (e.g., 2)
    height: string (CSS height value, e.g., '20px')
    width: string (CSS width value, e.g., '80px')
- type: heatmap
  description: Renders a graphical representation of data where individual values
    are represented as colors in a matrix.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Requires complex grid and color rendering which is not supported. No
        direct alternative.
    - surface: email
      reason: Requires complex rendering (SVG/Canvas/CSS Grid), not suitable for static
        email content.
    - surface: pdf
      reason: Requires complex rendering (SVG/Canvas/CSS Grid), not suitable for static
        PDF content.
  fields:
    data: list of lists of numbers (e.g., [[1, 2, 3], [4, 5, 6]])
    labels_x: list of strings (labels for the x-axis, e.g., ['Mon', 'Tue', 'Wed'])
    labels_y: list of strings (labels for the y-axis, e.g., ['AM', 'PM'])
    color_scale: list of strings (colors for the gradient, e.g., ['#FFFFFF', '#FF0000']
      for white to red)
    unit: string (optional, unit for the data values, e.g., '°C')
- type: donut_stat
  description: Renders a single key metric with a surrounding donut chart indicating
    its proportion or progress.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Only the metric value, label, and percentage will be rendered as text.
        The visual donut chart is not supported.
    incompatible_on:
    - surface: email
      reason: Requires SVG or Canvas rendering for the donut chart, which is not supported
        in email clients.
    - surface: pdf
      reason: Requires dynamic rendering for the donut chart, not suitable for static
        PDF content.
  fields:
    value: number (the current value, e.g., 75)
    max_value: number (the maximum possible value, e.g., 100)
    label: string (descriptive label for the metric, e.g., 'Completion')
    unit: string (optional, unit for the value, e.g., '%')
    color: string (hex or named color for the donut segment, e.g., '#2196F3')
    size: string (CSS size value, e.g., '100px')
- type: metric_delta
  description: Renders a key performance indicator with its current value and a numerical
    or percentage change from a previous period, often with an up/down indicator.
  source:
    name: a2ui-catalogue
    url: https://a2ui.dev
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    label: string (descriptive label for the metric, e.g., 'Sales')
    current_value: string (the current formatted value, e.g., '$12,345')
    delta_value: string (the formatted change value, e.g., '+$1,234' or '+10%')
    delta_type: enum (increase, decrease, no_change) - determines icon/color
    unit: string (optional, unit for the current value, e.g., 'USD')
    previous_period_label: string (optional, e.g., 'vs. last month')
- type: trend_indicator
  description: Renders a simple visual indicator (e.g., arrow, icon) representing
    the direction of a trend, often accompanied by a descriptive text.
  source:
    name: a2ui-catalogue
    url: https://a2ui.dev
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    trend_direction: enum (up, down, stable) - determines the icon or arrow direction
    label: string (descriptive text for the trend, e.g., 'Improving', 'Declining',
      'Steady')
    context: string (optional, additional context, e.g., 'over last 30 days')
    color: string (optional, hex or named color for the indicator, e.g., 'green' for
      'up', 'red' for 'down')
- type: breadcrumb
  description: A navigation aid indicating the user's current location within a hierarchical
    structure.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Renders as a series of linked text elements without visual separators
        or interactive styling.
    - surface: email
      note: Renders as a simple list of text links, losing interactive styling and
        visual separators.
    - surface: pdf
      note: Renders as a simple list of text links, losing interactive styling and
        visual separators.
  fields:
    items: 'list of {label: string, url: string, is_current: boolean}'
- type: pagination
  description: A control for navigating through a series of pages or results.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Renders as a set of buttons or text links. Complex styling and active
        page indication might be limited.
    - surface: email
      note: Renders as a simple list of links, losing interactive styling and current
        page indication.
    - surface: pdf
      note: Renders as a simple list of links, losing interactive styling and current
        page indication.
  fields:
    current_page: integer
    total_pages: integer
    base_url: string (the URL prefix for all page links)
    page_param: string (e.g., 'page', the query parameter name for the page number)
- type: stepper
  description: A component that displays progress through a sequence of logical and
    numbered steps.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Renders as a list of text items, possibly with emojis for status, but
        without visual connectors or progress lines.
    - surface: email
      note: Renders as a simple ordered list, losing visual progress indicators and
        interactive states.
    - surface: pdf
      note: Renders as a simple ordered list, losing visual progress indicators and
        interactive states.
  fields:
    steps: 'list of {label: string, is_completed: boolean, is_current: boolean, is_optional:
      boolean (optional), description: string (optional)}'
- type: tab_bar
  description: A horizontal navigation component displaying a set of clickable tabs,
    typically leading to different sections or pages.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Renders as a series of buttons or text links. Visual tab styling and active
        state might be limited.
    - surface: email
      note: Renders as a simple list of links, losing visual tab styling and active
        state.
    - surface: pdf
      note: Renders as a simple list of links, losing visual tab styling and active
        state.
  fields:
    tabs: 'list of {label: string, url: string, is_active: boolean, icon: string (optional,
      e.g., ''home'')}'
- type: anchor_list
  description: A list of links that navigate to specific sections within the current
    document or to external URLs.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - email
    - pdf
    degraded_on:
    - surface: googlechat
      note: Renders as a list of hyperlinks. Internal document anchors are not supported;
        links must point to external URLs or other cards.
  fields:
    anchors: 'list of {label: string, url: string, target_id: string (optional, for
      in-document navigation on web/pdf)}'
- type: faq_accordion
  description: Renders a list of questions and answers, where answers are hidden until
    the question is clicked.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: Renders as a simple list of questions and answers without interactive
        collapse/expand functionality.
    - surface: email
      note: Renders as a simple list of questions and answers without interactive
        collapse/expand functionality.
  fields:
    items: list of objects, each with 'question' (string) and 'answer' (string)
- type: glossary_term
  description: Renders a term with its definition, often with an optional link for
    more details.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    term: string (the term itself)
    definition: string (the explanation)
    link_text: optional string (e.g., "Learn more")
    link_url: optional string (URL for more details)
- type: footnote
  description: Renders a numbered footnote reference and its corresponding text, typically
    at the bottom of a section or page.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - googlechat
    - email
    - pdf
  fields:
    number: integer (the footnote number)
    text: string (the footnote content)
    id: string (unique identifier for linking, e.g., "fn1")
- type: blockquote_with_avatar
  description: Renders a blockquote with an associated avatar and attribution.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    - pdf
    degraded_on:
    - surface: googlechat
      note: Renders as a simple blockquote with text attribution; avatar image is
        not supported.
    - surface: email
      note: Renders as a simple blockquote with text attribution; avatar image is
        not supported.
  fields:
    quote: string (the quoted text)
    author_name: string (name of the person quoted)
    author_title: optional string (title or role of the person)
    avatar_url: optional string (URL to the author's avatar image)
- type: pull_stat
