    card_image_url: string, optional An optional image to display within the card.
- type: collapsible_panel
  description: Renders a standalone section of content that can be toggled between
  compact_description: expandable content panel with header toggle
    visible and hidden states by clicking a control, using only CSS.
  source:
    name: a2ui-catalogue
    url: https://a2ui.com/catalogue
    license: MIT
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Relies on CSS `:checked` pseudo-class for interactivity, which is not
        supported.
    - surface: email
      reason: Relies on CSS `:checked` pseudo-class for interactivity, which is not
        supported.
    - surface: pdf
      reason: Relies on CSS `:checked` pseudo-class for interactivity, which is not
        supported.
  fields:
    toggle_label: string The text for the control that expands/collapses the content.
    initial_state: string, default "collapsed" The initial state of the panel ("expanded"
      or "collapsed").
    content: string The main content to be shown or hidden.
- type: css_modal
  description: Renders a modal dialog that appears on click and can be dismissed,
  compact_description: pure-CSS modal dialog triggered by checkbox
    controlled purely by CSS without JavaScript.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Relies on CSS `:checked` pseudo-class for interactivity and fixed positioning,
        which are not supported.
    - surface: email
      reason: Relies on CSS `:checked` pseudo-class for interactivity and fixed positioning,
        which are not supported.
    - surface: pdf
      reason: Relies on CSS `:checked` pseudo-class for interactivity and fixed positioning,
        which are not supported.
  fields:
    trigger_text: string The text or element that, when clicked, opens the modal.
    modal_title: string The title displayed at the top of the modal.
    modal_body: string The main content of the modal dialog.
    close_button_label: string, default "Close" The label for the button to close
      the modal.
