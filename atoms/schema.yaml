- type: alert_banner
  description: A prominent banner displaying a message, often with an icon and an
  compact_description: full-width status alert strip
    optional action.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    degraded_on:
    - surface: googlechat
      note: Renders as a basic card with text and button; no custom icons, complex
        layouts, or animations.
    incompatible_on:
    - surface: email
      reason: Relies on complex CSS for layout, icons, and interactive elements which
        are not reliably supported.
  fields:
    message: string The main message to display in the banner.
    type: string The type of alert (e.g., "info", "warning", "error", "success").
    icon: string Optional icon name to display next to the message.
    action_label: string Optional text for an action button.
    action_url: string Optional URL for the action button.
- type: toast_notification
  description: A small, temporary, non-intrusive message that appears and disappears
  compact_description: transient popup notification message
    automatically.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Google Chat does not support transient, non-blocking UI elements or
        animations.
    - surface: email
      reason: Email does not support transient, non-blocking UI elements or animations.
  fields:
    message: string The message to display in the toast.
    type: string The type of notification (e.g., "success", "error", "info").
    duration: integer The time in milliseconds the toast should be visible.
- type: loading_skeleton
  description: A placeholder UI that shows the structure of content while it's loading,
  compact_description: animated placeholder skeleton while content loads
    indicating active data fetching.
  source: *id003
  surfaces:
    works_on:
    - web
    - meet-stage
    incompatible_on:
    - surface: googlechat
      reason: Google Chat does not support custom UI elements with animated loading
        states.
    - surface: email
      reason: Email does not support custom UI elements with animated loading states.
  fields:
    shape: string The general shape of the content being loaded (e.g., "card", "list",
      "text_block").
    lines: integer The number of lines of text to simulate in the skeleton.
    has_image: boolean Indicates if the skeleton should include an image placeholder.
